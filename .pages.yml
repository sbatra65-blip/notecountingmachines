# Pages CMS (app.pagescms.org): edit blog posts and news in the browser.
# Saving a post commits to GitHub, and Cloudflare rebuilds the site automatically.
media:
  input: public/img/uploads
  output: /img/uploads

content:
  - name: news
    label: Fake currency news
    type: collection
    path: src/content/news
    view:
      fields: [title, pubDate, draft]
    fields: &post
      - name: title
        label: Title (55–65 characters, main keyword first)
        type: string
        required: true
      - name: description
        label: Meta description (under 160 characters)
        type: text
        required: true
      - name: pubDate
        label: Published
        type: date
        required: true
      - name: updatedDate
        label: Updated (fill when you change facts)
        type: date
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - { value: counterfeit-news, label: Counterfeit news }
            - { value: spot-fakes, label: How to spot fakes }
            - { value: buying-guide, label: Buying guides }
            - { value: industry, label: Industry }
            - { value: hindi, label: हिंदी }
      - name: author
        label: Author
        type: string
        default: NoteCountingMachines.com team
      - name: lang
        label: Language
        type: select
        default: en
        options:
          values:
            - { value: en, label: English }
            - { value: hi, label: Hindi }
      - name: tile
        label: Card headline (big text on the card, e.g. "₹500 ↑ 20.5%")
        type: string
        required: true
      - name: tileSub
        label: Card sub-line
        type: string
      - name: tileColor
        label: Card colour
        type: select
        default: ink
        options:
          values:
            - { value: ink, label: Navy }
            - { value: amber, label: Amber }
            - { value: mist, label: Light grey }
      - name: takeaways
        label: Key takeaways (3–4 one-line facts; AI search quotes these)
        type: string
        list: true
      - name: product
        label: Machine to promote at the end
        type: select
        default: t800
        options:
          values:
            - { value: t800, label: T-800 mix value }
            - { value: t100, label: T-100 semi value }
            - { value: ec442, label: Kores EasyCount 442 }
            - { value: none, label: None }
      - name: faq
        label: FAQ (shows on page + Google FAQ markup)
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer (start with the direct answer), type: text }
      - name: sources
        label: Sources (required for news)
        type: object
        list: true
        fields:
          - { name: title, label: Source name, type: string }
          - { name: url, label: Link, type: string }
      - name: featured
        label: Feature at top of blog
        type: boolean
      - name: draft
        label: Draft (not published)
        type: boolean
        default: true
      - name: body
        label: Article
        type: rich-text
  - name: blog
    label: Blog & guides
    type: collection
    path: src/content/blog
    view:
      fields: [title, category, pubDate, draft]
    fields: *post
